<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Pusher App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; }
    .row { margin-bottom: 16px; }
    input, button { padding: 8px 10px; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; }
    label { display: block; margin: 8px 0 4px; }
  </style>
</head>
<body>
  <h2>Register a Pusher-style app</h2>

  <form id="registerForm">
    <div class="row">
      <label for="appName">App name</label>
      <input id="appName" type="text" placeholder="e.g. my-flask-client" required />
      <button type="submit">Register app</button>
    </div>
  </form>

  <div id="status"></div>

  <div id="credentials" style="display:none; margin-top:24px;">
    <h3>App credentials</h3>
    <div class="row">
      <label for="appId">App ID</label>
      <input id="appId" type="text" readonly />
    </div>
    <div class="row">
      <label for="appKey">App key</label>
      <input id="appKey" type="text" readonly />
    </div>
    <div class="row">
      <label for="appSecret">App secret</label>
      <input id="appSecret" type="text" readonly />
    </div>

    <p>Use these values in your Flask client:</p>
    <pre id="envBlock"></pre>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const statusBox = document.getElementById('status');
    const credentialsBox = document.getElementById('credentials');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      const name = document.getElementById('appName').value.trim();
      if (!name) {
        statusBox.textContent = 'Please enter an app name.';
        return;
      }

      statusBox.textContent = 'Registering app...';

      try {
        const res = await fetch('/apps', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Failed to create app');
        }

        document.getElementById('appId').value = data.id;
        document.getElementById('appKey').value = data.key;
        document.getElementById('appSecret').value = data.secret;
        document.getElementById('envBlock').textContent = [
          `APP_ID=${data.id}`,
          `APP_KEY=${data.key}`,
          `APP_SECRET=${data.secret}`
        ].join('\n');

        credentialsBox.style.display = 'block';
        statusBox.textContent = 'App registered successfully.';
      } catch (error) {
        statusBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>
