<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Private channel</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; }
    .row { margin-bottom: 16px; }
    input, button, textarea { padding: 8px 10px; }
    textarea { width: 100%; max-width: 720px; min-height: 100px; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    label { display: block; margin: 8px 0 4px; }
    .panel { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
    .status { margin: 12px 0; color: #333; }
  </style>
</head>
<body>
  <h2>Private channel</h2>
  <p>Logged in as <strong>{{ username }}</strong>. <a href="/">Public channel</a></p>
  <button id="logoutBtn" type="button">Logout</button>

  <div class="panel">
    <div class="row">
      <label for="channel">Private channel</label>
      <input id="channel" type="text" value="private-orders" />
    </div>
    <button id="connectBtn" type="button">Connect & authorize</button>
    <button id="disconnectBtn" type="button">Disconnect</button>
    <div id="status" class="status">{{ initial_status }}</div>
  </div>

  <div class="panel">
    <label for="eventName">Event name</label>
    <input id="eventName" type="text" value="message" />
    <label for="eventPayload">Payload JSON</label>
    <textarea id="eventPayload">{"text":"Hello from private channel!"}</textarea>
    <button id="publishBtn" type="button">Publish message</button>
  </div>

  <div class="panel">
    <h3>Messages received</h3>
    <pre id="messages">Waiting for events...</pre>
  </div>

  <script>
    const appId = {{ app_id|tojson }};
    const appKey = {{ app_key|tojson }};
    const goBaseUrl = {{ go_base_url|tojson }};
    const csrfToken = {{ csrf_token|tojson }};
    const channelEl = document.getElementById('channel');
    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    let socket = null;
    let socketId = null;

    function appendMessage(text) {
      const existing = messagesEl.textContent === 'Waiting for events...' ? '' : messagesEl.textContent + '\n';
      messagesEl.textContent = existing + text;
    }

    async function requestGrant() {
      const response = await fetch('/api/private-channel-auth', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
        body: JSON.stringify({ socket_id: socketId, channel: channelEl.value.trim() })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Private-channel authorization failed');
      return data.auth;
    }

    function connect() {
      const channel = channelEl.value.trim();
      if (!channel.startsWith('private-')) { statusEl.textContent = 'Channel must start with private-.'; return; }
      if (!appId) { statusEl.textContent = 'Missing required Flask setting: APP_ID.'; return; }
      if (!appKey) { statusEl.textContent = 'Missing required Flask setting: APP_KEY.'; return; }
      const base = new URL(goBaseUrl);
      base.protocol = base.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${base.origin}/apps/${encodeURIComponent(appId)}/ws?key=${encodeURIComponent(appKey)}`);
      socket.onopen = () => { statusEl.textContent = 'Connected. Waiting for socket ID...'; };
      socket.onmessage = async (event) => {
        const message = JSON.parse(event.data);
        if (message.event === 'connected') {
          socketId = message.socket_id;
          try {
            const auth = await requestGrant();
            socket.send(JSON.stringify({ action: 'subscribe', channel, auth }));
            appendMessage(`Authorized and subscribed to ${channel}`);
          } catch (error) { statusEl.textContent = error.message; }
          return;
        }
        appendMessage(JSON.stringify(message, null, 2));
      };
      socket.onerror = () => { statusEl.textContent = 'Websocket connection error.'; };
      socket.onclose = () => { statusEl.textContent = 'Disconnected from websocket.'; };
    }

    document.getElementById('connectBtn').onclick = connect;
    document.getElementById('disconnectBtn').onclick = () => { if (socket) socket.close(); socketId = null; };
    document.getElementById('logoutBtn').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); window.location.href = '/login?next=/private'; };
    document.getElementById('publishBtn').onclick = async () => {
      let payload;
      try { payload = JSON.parse(document.getElementById('eventPayload').value || '{}'); }
      catch { statusEl.textContent = 'Payload must be valid JSON.'; return; }
      const response = await fetch('/api/events', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channel: channelEl.value.trim(), event: document.getElementById('eventName').value.trim() || 'message', payload })
      });
      const data = await response.json();
      statusEl.textContent = response.ok ? 'Event published successfully.' : (data.error || 'Publish failed');
    };
  </script>
</body>
</html>
