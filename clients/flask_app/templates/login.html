<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; max-width: 480px; }
    .row { margin-bottom: 16px; }
    input, button { padding: 8px 10px; }
    label { display: block; margin: 8px 0 4px; }
    .status { margin-top: 16px; }
  </style>
</head>
<body>
  <h2>Private channel login</h2>
  <p>Log in before opening the private channel.</p>
  <div class="row"><label for="username">Username</label><input id="username" autocomplete="username" /></div>
  <div class="row"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" /></div>
  <button id="loginBtn" type="button">Login</button>
  <button id="registerBtn" type="button">Register</button>
  <p id="status" class="status"></p>
  <p><a href="/">Back to public channel</a></p>
  <script>
    const nextPath = {{ next_path|tojson }};
    const statusEl = document.getElementById('status');
    async function submit(path) {
      const response = await fetch(path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Authentication failed');
      window.location.href = nextPath;
    }
    document.getElementById('loginBtn').onclick = async () => { try { await submit('/api/login'); } catch (error) { statusEl.textContent = error.message; } };
    document.getElementById('registerBtn').onclick = async () => { try { await submit('/api/register'); } catch (error) { statusEl.textContent = error.message; } };
  </script>
</body>
</html>
